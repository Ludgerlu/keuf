<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEUF ENGINEERING — Nouvel employé</title>
    <!-- Bootstrap 5 + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Unified KEUF CSS -->
    <link rel="stylesheet" href="../asset/css/style.css">
    <style>
        /* Employee form specific styles */
        .avatar-preview {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            color: white;
            transition: all 0.3s;
        }
        
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .color-dot:hover {
            transform: scale(1.1);
        }
        
        .color-dot.selected {
            border-color: var(--black-keuf);
            box-shadow: 0 0 0 2px var(--yellow-keuf);
        }
        
        .form-section {
            background: #f9fafc;
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        
        .form-section-title {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--grey-keuf);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #dee2ed;
        }
        
        .form-label-custom {
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: #374151;
        }
        
        .btn-primary-custom {
            background: var(--yellow-keuf);
            border: none;
            color: black;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary-custom:hover {
            background: #c29e36;
            color: black;
        }
        
        .btn-secondary-custom {
            background: white;
            border: 1px solid #dee2ed;
            color: #374151;
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            border-radius: 30px;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary-custom:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        
        .certif-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            margin-bottom: 0.5rem;
            border: 1px solid #dee2ed;
        }
        
        .certif-name {
            font-weight: 500;
            font-size: 0.85rem;
        }
        
        .certif-exp {
            font-size: 0.75rem;
            color: var(--grey-keuf);
            margin-left: 1rem;
        }
        
        .btn-remove-cert {
            color: var(--red);
            background: none;
            border: none;
            font-size: 1.1rem;
            padding: 0 0.25rem;
        }
        
        .btn-remove-cert:hover {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar p-0" id="sidebar">
            <div class="p-4 pb-3 border-bottom">
                <div class="d-flex align-items-center justify-content-center">
                    <img src="../asset/logo/logo.jpg" alt="" width="100" />
                </div>
            </div>
            <nav class="p-3 flex-grow-1">
                <div class="small text-uppercase px-3 pb-2" style="font-size:0.625rem; letter-spacing:1.5px">Principal</div>
                <a class="nav-item d-flex align-items-center mb-2" href="../index.html"><i class="bi bi-house-door"></i><span>Tableau de bord</span></a>
                <a class="nav-item d-flex align-items-center mb-2" href="../projects/index.html"><i class="bi bi-building"></i><span>Projets</span></a>
                <div class="small text-uppercase px-3 pb-2 mt-3" style="font-size:0.625rem; letter-spacing:1.5px">Opérations</div>
                <a class="nav-item active d-flex align-items-center mb-2" href="#"><i class="bi bi-people"></i><span>Employés</span></a>
                <a class="nav-item d-flex align-items-center mb-2" href="../stocks.html"><i class="bi bi-box"></i><span>Stocks</span><span class="nav-badge">3</span></a>
                <div class="small text-uppercase px-3 pb-2 mt-3" style="font-size:0.625rem; letter-spacing:1.5px">Administration</div>
                <a class="nav-item d-flex align-items-center mb-2" href="#"><i class="bi bi-gear"></i><span>Paramètres</span></a>
            </nav>
            <div class="p-3 border-top d-flex align-items-center gap-2">
                <div class="user-avatar">AD</div>
                <div class="flex-grow-1">
                    <div class="small fw-medium">Administrateur</div>
                </div>
                <div class="text-secondary" onclick="location.href='../login.html'" style="cursor: pointer" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></div>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <div class="main-area flex-grow-1">
            <header class="bg-white py-3 px-4 border-bottom sticky-top d-flex align-items-center justify-content-between">
                <button class="btn btn-link d-md-none p-0 text-dark" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
                <div class="fw-bold font-syne"><i class="bi bi-people me-2" style="color:var(--yellow-keuf);"></i>Employés</div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary small" id="topbar-date"></span>
                    <div class="position-relative">
                        <button class="btn btn-light border p-2 rounded"><i class="bi bi-bell"></i></button>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width:8px;height:8px;"></span>
                    </div>
                </div>
            </header>

            <div class="p-4">
                <!-- Breadcrumb -->
                <nav class="mb-4" style="--bs-breadcrumb-divider:'›';">
                    <ol class="breadcrumb" style="font-size:.8125rem;">
                        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Employés</a></li>
                        <li class="breadcrumb-item active" id="bc-title">Nouvel employé</li>
                    </ol>
                </nav>

                <!-- Main Form Card -->
                <div class="section-card">
                    <div class="section-card-head">
                        <div class="section-card-title" id="form-title">
                            <i class="bi bi-person-plus" style="color:var(--yellow-keuf);"></i>
                            Nouvel employé
                        </div>
                        <button class="btn-secondary-custom btn-sm" onclick="resetForm()" id="btn-reset-form" style="display:none;">
                            <i class="bi bi-x-circle"></i>Annuler l'édition
                        </button>
                    </div>
                    <div class="p-4">

                        <!-- Avatar preview + color picker -->
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="avatar-preview" id="avatar-preview" style="background:#2563EB;">KM</div>
                            <div>
                                <div class="form-label-custom mb-2">Couleur de l'avatar</div>
                                <div class="d-flex gap-2 flex-wrap" id="color-picker">
                                    <div class="color-dot selected" style="background:#2563EB;" data-color="#2563EB" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#10B981;" data-color="#10B981" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#F59E0B;" data-color="#F59E0B" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#EF4444;" data-color="#EF4444" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#7C3AED;" data-color="#7C3AED" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#0891B2;" data-color="#0891B2" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#DC2626;" data-color="#DC2626" onclick="selectColor(this)"></div>
                                    <div class="color-dot" style="background:#059669;" data-color="#059669" onclick="selectColor(this)"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Identité -->
                        <div class="form-section">
                            <div class="form-section-title">Identité</div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label-custom">Nom complet *</label>
                                    <input class="form-control" id="f-nom" placeholder="ex: KAMGA Michel" oninput="updatePreview()">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Rôle / Poste *</label>
                                    <input class="form-control" id="f-role" placeholder="ex: Chef de chantier" list="roles-list">
                                    <datalist id="roles-list">
                                        <option value="Chef de chantier">
                                        </option><option value="Maçon">
                                        </option><option value="Électricien">
                                        </option><option value="Plombier">
                                        </option><option value="Conducteur d'engins">
                                        </option><option value="Manœuvre">
                                        </option><option value="Technicien">
                                        </option><option value="Ingénieur">
                                        </option><option value="Contrôleur">
                                        </option><option value="Magasinier">
                                    </option></datalist>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Téléphone</label>
                                    <input class="form-control" id="f-tel" placeholder="+237 6XX XXX XXX" type="tel">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Email</label>
                                    <input class="form-control" id="f-email" placeholder="email@keuf.cm" type="email">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Date d'embauche</label>
                                    <input class="form-control" id="f-embauche" type="date">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label-custom">Statut</label>
                                    <select class="form-select" id="f-statut">
                                        <option value="Actif">Actif</option>
                                        <option value="Inactif">Inactif</option>
                                        <option value="En congé">En congé</option>
                                    </select>
                                </div>
                            </div>
                        </div>


                        <!-- Notes -->
                        <div class="form-section">
                            <div class="form-section-title">Notes</div>
                            <textarea class="form-control" id="f-notes" rows="2" placeholder="Informations complémentaires…"></textarea>
                        </div>

                        <div class="d-flex gap-2 pt-2">
                            <button class="btn-primary-custom" onclick="saveEmploye()">
                                <i class="bi bi-check-lg"></i><span id="btn-save-label">Créer l'employé</span>
                            </button>
                            <button class="btn-secondary-custom" onclick="resetForm()">
                                <i class="bi bi-x"></i>Annuler
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-custom" id="toast">
        <div class="toast-icon"><i class="bi bi-check text-white small"></i></div>
        <span id="toast-msg">Employé enregistré</span>
    </div>

    <script>
        let currentColor = '#2563EB';
        let certifications = [];

        // Mobile menu
        const mobileMenuBtn = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        function toggleSidebar() { 
            sidebar.classList.toggle('show'); 
            overlay.classList.toggle('show'); 
        }
        
        if(mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);
        }

        // Date
        document.getElementById('topbar-date').textContent = new Date().toLocaleDateString('fr-FR', { 
            weekday:'long', day:'numeric', month:'long', year:'numeric' 
        });

        // Check if editing mode
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');
        
        if (editId) {
            document.getElementById('form-title').innerHTML = '<i class="bi bi-pencil-square" style="color:var(--yellow-keuf);"></i> Modifier employé';
            document.getElementById('btn-save-label').textContent = 'Mettre à jour';
            document.getElementById('bc-title').textContent = 'Modifier employé';
            document.getElementById('btn-reset-form').style.display = 'inline-flex';
            loadEmployeeData(editId);
        }

        // Color selection
        function selectColor(element) {
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
            element.classList.add('selected');
            currentColor = element.getAttribute('data-color');
            updatePreview();
        }

        // Update avatar preview
        function updatePreview() {
            const nom = document.getElementById('f-nom').value;
            const preview = document.getElementById('avatar-preview');
            let initials = 'AB';
            
            if (nom) {
                const words = nom.split(' ');
                if (words.length >= 2) {
                    initials = words[0].charAt(0) + words[1].charAt(0);
                } else {
                    initials = nom.substring(0, 2).toUpperCase();
                }
            }
            
            preview.textContent = initials;
            preview.style.background = currentColor;
        }

        // Add certification
        function addCertif() {
            const nom = document.getElementById('certif-nom').value.trim();
            const exp = document.getElementById('certif-exp').value;
            
            if (!nom) {
                showToast('Veuillez saisir un nom de certification', 'error');
                return;
            }
            
            const certif = {
                nom: nom,
                expiration: exp || null
            };
            
            certifications.push(certif);
            renderCertifs();
            
            // Clear inputs
            document.getElementById('certif-nom').value = '';
            document.getElementById('certif-exp').value = '';
        }

        // Render certifications list
        function renderCertifs() {
            const container = document.getElementById('certifs-list');
            if (certifications.length === 0) {
                container.innerHTML = '<div class="text-secondary small py-2">Aucune certification ajoutée</div>';
                return;
            }
            
            let html = '';
            certifications.forEach((certif, index) => {
                const expDate = certif.expiration ? new Date(certif.expiration).toLocaleDateString('fr-FR') : 'Pas d\'expiration';
                html += `
                    <div class="certif-item">
                        <div>
                            <span class="certif-name">${certif.nom}</span>
                            <span class="certif-exp">${expDate}</span>
                        </div>
                        <button class="btn-remove-cert" onclick="removeCertif(${index})">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Remove certification
        function removeCertif(index) {
            certifications.splice(index, 1);
            renderCertifs();
        }

        // Reset form
        function resetForm() {
            if (confirm('Voulez-vous annuler les modifications ?')) {
                window.location.href = 'index.html';
            }
        }

        // Load employee data for editing
        function loadEmployeeData(id) {
            // Simulate loading data
            setTimeout(() => {
                document.getElementById('f-nom').value = 'KAMGA Michel';
                document.getElementById('f-role').value = 'Chef de chantier';
                document.getElementById('f-tel').value = '+237 699 123 456';
                document.getElementById('f-email').value = 'm.kamga@keuf.cm';
                document.getElementById('f-embauche').value = '2022-01-15';
                document.getElementById('f-statut').value = 'Actif';
                document.getElementById('f-notes').value = 'Expérimenté, disponible pour nouveaux chantiers';
                
                // Load certifications
                certifications = [
                    { nom: 'CACES R482', expiration: '2025-12-31' },
                    { nom: 'SST', expiration: '2026-03-15' }
                ];
                renderCertifs();
                updatePreview();
            }, 300);
        }

        // Save employee
        function saveEmploye() {
            const nom = document.getElementById('f-nom').value.trim();
            const role = document.getElementById('f-role').value.trim();
            
            if (!nom || !role) {
                showToast('Veuillez remplir tous les champs obligatoires', 'error');
                return;
            }
            
            const employe = {
                nom: nom,
                role: role,
                tel: document.getElementById('f-tel').value,
                email: document.getElementById('f-email').value,
                embauche: document.getElementById('f-embauche').value,
                statut: document.getElementById('f-statut').value,
                notes: document.getElementById('f-notes').value,
                couleur: currentColor,
                certifications: certifications
            };
            
            console.log('Employé sauvegardé:', employe);
            
            const action = editId ? 'modifié' : 'créé';
            showToast(`Employé ${action} avec succès`);
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Toast function
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.querySelector('.toast-icon');
            
            toastMsg.innerText = msg;
            
            if (type === 'error') {
                toastIcon.style.background = 'var(--red)';
                toastIcon.innerHTML = '<i class="bi bi-exclamation text-white small"></i>';
            } else {
                toastIcon.style.background = 'var(--green)';
                toastIcon.innerHTML = '<i class="bi bi-check text-white small"></i>';
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
