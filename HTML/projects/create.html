<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEUF ENGINEERING — Tableau de bord · Projets (DataTable)</title>
    <!-- Bootstrap 5 + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- DataTables CSS + Bootstrap 5 integration -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <!-- Unified KEUF CSS -->
    <link rel="stylesheet" href="../asset/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Overlay (mobile) + Sidebar identique à l'index -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar p-0" id="sidebar">
            <div class="p-4 pb-3 border-bottom border-white border-opacity-10">
                <div class="d-flex align-items-center justify-content-center">
                    <img src="../asset/logo/logo.jpg" alt="" width="100" />
                </div>
            </div>
            <nav class="p-3 flex-grow-1">
                <div class="small text-uppercase px-3 pb-2" style="font-size:0.625rem; letter-spacing:1.5px">Principal</div>
                <a class="nav-item d-flex align-items-center mb-2" href="../index.html"><i class="bi bi-house-door"></i><span>Tableau de bord</span></a>
                <a class="nav-item active d-flex align-items-center mb-2" href="./projects/index.html"><i class="bi bi-building"></i><span>Projets</span></a>
                <div class="small text-uppercase px-3 pb-2 mt-3" style="font-size:0.625rem; letter-spacing:1.5px">Opérations</div>
                <a class="nav-item d-flex align-items-center" href="../employees/index.html"><i class="bi bi-people"></i><span>Employés</span></a>
                <a class="nav-item d-flex align-items-center" href="../stocks.html"><i class="bi bi-box"></i><span>Stocks</span><span class="nav-badge">3</span></a>
                <div class="small text-uppercase px-3 pb-2 mt-3" style="font-size:0.625rem; letter-spacing:1.5px">Administration</div>
                <div class="nav-item d-flex align-items-center"><i class="bi bi-gear"></i><span>Paramètres</span></div>
            </nav>
            <div class="p-3 border-top d-flex align-items-center gap-2">
                <div class="user-avatar">AD</div>
                <div class="flex-grow-1">
                    <div class="small fw-medium">Administrateur</div>
                    <div class="small text-secondary">Admin · KEUF</div>
                </div>
                <div class="text-secondary" style="cursor:pointer;" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></div>
            </div>
        </aside>

        <!-- MAIN AREA : contenu de la page de création (vue séparée) -->
        <div class="main-area flex-grow-1">
            <header class="bg-white py-3 px-4 border-bottom sticky-top d-flex align-items-center justify-content-between">
                <button class="btn btn-link d-md-none p-0 text-dark" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
                <div class="fw-bold font-syne" style="font-size:1.125rem;">
                    <i class="bi bi-plus-circle me-2" style="color:var(--yellow-keuf);"></i>Création d'un projet
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-secondary small" id="topbar-date"></span>
                    <div class="position-relative">
                        <button class="btn btn-light border p-2 rounded"><i class="bi bi-bell"></i></button>
                        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width:8px;height:8px;"></span>
                    </div>
                </div>
            </header>

            <!-- Contenu principal : formulaire de création -->
            <div class="p-4">
                <div class="d-flex align-items-center mb-4">
                    <a href="./index.html" class="btn btn-grey-keuf text-decoration-none me-3"><i class="bi bi-arrow-left me-1"></i> Retour</a>
                    <h2 class="fw-bold font-syne mb-0" style="font-size:1.7rem;">Nouveau projet</h2>
                </div>

                <!-- Formulaire séparé (pas de modal, une vraie page) -->
                <div class="form-card">
                    <form id="formCreateProjet" onsubmit="event.preventDefault(); simulateCreate();">
                        <!-- ligne 1 : nom et client -->
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="nom" class="form-label fw-medium required">Nom du projet</label>
                                <input type="text" class="form-control form-control-lg" id="nom" placeholder="ex: Construction résidence Akwa" required>
                            </div>
                            <div class="col-md-6">
                                <label for="client" class="form-label fw-medium required">Client</label>
                                <input type="text" class="form-control form-control-lg" id="client" placeholder="ex: M. Dupont / TOTAL Cameroun" required>
                            </div>
                        </div>

                        <!-- ligne 2 : budget + dates -->
                        <div class="row g-4 mb-4">
                            <div class="col-md-4">
                                <label for="budget" class="form-label fw-medium required">Budget (FCFA)</label>
                                <input type="number" class="form-control form-control-lg" id="budget" placeholder="50 000 000" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dateDebut" class="form-label fw-medium required">Date de début</label>
                                <input type="date" class="form-control form-control-lg" id="dateDebut" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dateFin" class="form-label fw-medium required">Date de fin prévue</label>
                                <input type="date" class="form-control form-control-lg" id="dateFin" required>
                            </div>
                        </div>

                        <!-- ligne optionnelle : responsable (pas obligatoire) -->
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label for="responsable" class="form-label fw-medium">Responsable de projet</label>
                                <input type="text" class="form-control" id="responsable" placeholder="ex: Jean K.">
                            </div>
                            <div class="col-md-6">
                                <label for="reference" class="form-label fw-medium">Réf. interne</label>
                                <input type="text" class="form-control" id="reference" placeholder="KEUF-2026-001">
                            </div>
                        </div>

                        <!-- Section phases (checkboxes, style intégré) -->
                        <div class="phase-checkbox-group mt-5 mb-4">
                            <h5 class="font-syne fw-bold mb-3"><i class="bi bi-diagram-3 me-2" style="color:var(--yellow-keuf);"></i>Phases du projet</h5>
                            <p class="text-secondary small mb-3">Sélectionnez les phases applicables (par défaut la première est suggérée)</p>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="etude" id="phase1" checked>
                                        <label class="form-check-label fw-medium" for="phase1">Étude & conception</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="terrassement" id="phase2">
                                        <label class="form-check-label fw-medium" for="phase2">Terrassement</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="fondation" id="phase3">
                                        <label class="form-check-label fw-medium" for="phase3">Fondation</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="structure" id="phase4">
                                        <label class="form-check-label fw-medium" for="phase4">Structure béton</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="electricite" id="phase5">
                                        <label class="form-check-label fw-medium" for="phase5">Électricité</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="plomberie" id="phase6">
                                        <label class="form-check-label fw-medium" for="phase6">Plomberie</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="finitions" id="phase7">
                                        <label class="form-check-label fw-medium" for="phase7">Finitions</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="reception" id="phase8">
                                        <label class="form-check-label fw-medium" for="phase8">Réception</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Notes / commentaire -->
                        <div class="mb-4">
                            <label for="notes" class="form-label fw-medium">Notes additionnelles (optionnel)</label>
                            <textarea class="form-control" id="notes" rows="3" placeholder="Informations complémentaires..."></textarea>
                        </div>

                        <!-- Actions du formulaire (boutons) -->
                        <div class="d-flex gap-3 justify-content-end border-top pt-4 mt-4">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">Annuler</a>
                            <button type="submit" class="btn btn-yellow-keuf px-5 py-2 fw-medium"><i class="bi bi-save me-2"></i>Créer le projet</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de confirmation (identique) -->
    <div class="toast-custom" id="toast">
        <div class="toast-icon"><i class="bi bi-check text-white small"></i></div>
        <span id="toast-msg">Projet créé avec succès</span>
    </div>

    <!-- Scripts : Bootstrap, mobile menu, simulation de création -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mise à jour de la date dans le header
        document.getElementById("topbar-date").textContent = new Date().toLocaleDateString("fr-FR", {
            weekday: "long", day: "numeric", month: "long", year: "numeric"
        });

        // Mobile menu (sidebar toggle)
        const mobileMenuBtn = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        function toggleSidebar() { 
            sidebar.classList.toggle('show'); 
            sidebarOverlay.classList.toggle('show'); 
        }
        if (mobileMenuBtn) {
            mobileMenuBtn.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }

        // Simulation de création (remplace l'envoi du formulaire)
        function simulateCreate() {
            // Petite validation basique (les champs required sont déjà gérés par le navigateur)
            const nom = document.getElementById('nom').value.trim();
            const client = document.getElementById('client').value.trim();
            if (!nom || !client) return; // ne devrait pas arriver grâce à required

            // Afficher un toast de confirmation
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = '✅ Projet "' + nom + '" créé (simulation)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);

            // Réinitialiser partiellement le formulaire (optionnel, commenté si on veut garder)
            // document.getElementById('formCreateProjet').reset();

            // Ici tu pourrais rediriger vers la liste des projets après un délai
            // setTimeout(() => { window.location.href = './projects/index.html'; }, 1500);
        }

        // Récupérer le bouton radio / checkbox : pas nécessaire pour la simulation
    </script>
    <style>
        /* style additionnel pour le toast */
        .toast-custom {
            position: fixed; bottom:28px; right:28px; background:#1f2937; color:white; padding:0.875rem 1.25rem;
            border-radius:12px; font-size:0.875rem; font-weight:500; z-index:1060; display:none; align-items:center;
            gap:10px; box-shadow:0 8px 32px rgba(0,0,0,0.25);
        }
        .toast-custom.show { display: flex; }
        .toast-icon { width:22px; height:22px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; }
        .form-check-input:checked { background-color: var(--yellow-keuf); border-color: var(--yellow-keuf); }
        .btn-yellow-keuf { background: var(--yellow-keuf); border-color: var(--yellow-keuf); color: black; font-weight: 600; }
        .btn-yellow-keuf:hover { background: #c29e36; }
    </style>
</body>
</html>
