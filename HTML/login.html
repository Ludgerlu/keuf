<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEUF ENGINEERING — Connexion</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --blue-1: #757575;
            --blue-dark: #6b6b6b;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f9ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            background: white;
            pointer-events: none;
        }
        
        .login-shape.s1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }
        
        .login-shape.s2 {
            width: 250px;
            height: 250px;
            bottom: -50px;
            left: -80px;
        }
        
        .login-shape.s3 {
            width: 150px;
            height: 150px;
            top: 40%;
            left: 10%;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.75rem;
            width: 420px;
            max-width: 90%;
            position: relative;
            z-index: 2;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.25);
            animation: fadeUp 0.5s ease both;
        }
        
        .login-logo-icon {
            width: 52px;
            height: 52px;
            background: var(--blue-1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.125rem;
            color: white;
        }
        
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-shape s1"></div>
    <div class="login-shape s2"></div>
    <div class="login-shape s3"></div>
    
    <div class="login-card">
        <div class="d-flex align-items-center gap-3 mb-4 justify-content-center">
            <img src="./asset/logo/logo.jpg" alt="" width="100">
        </div>
        
        <h2 class="text-center fw-bold mb-1" style="font-family: 'Syne', sans-serif; font-size: 1.5rem;">Connexion</h2>
        
        <form>
            <div class="mb-3">
                <label class="form-label small fw-medium text-uppercase">Identifiant</label>
                <input class="form-control" type="text" placeholder="admin@keuf.cm" value="admin@keuf.cm">
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-medium text-uppercase">Mot de passe</label>
                <input class="form-control" type="password" placeholder="••••••••" value="••••••••">
            </div>
            
            <button type="button" class="btn btn-primary w-100 py-3 fw-bold" onclick="location.href='index.html'" style="background: var(--blue-1); border: none;">
                Se connecter <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>
    </div>
</body>
</html>
